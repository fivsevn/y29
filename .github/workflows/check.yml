name: Test and build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image conversion dependencies
        run: npm ci
      - name: Check rules, public content and static build
        run: npm run check
      - name: Keep reviewable static preview
        uses: actions/upload-artifact@v4
        with:
          name: y29-preview
          path: dist/
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium webkit
      - name: Check compact images, full discussions, scrolling and likes
        run: |
          set -euo pipefail
          node serve.js > /tmp/y29-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/lucifer0/ > /dev/null; then break; fi
            sleep 1
          done
          Y29_SCREENSHOTS=test-results/images node tests/social-images.browser.mjs
          Y29_SCREENSHOTS=test-results/chromium node tests/social.browser.mjs
          Y29_SCREENSHOTS=test-results/webkit Y29_BROWSER=webkit node tests/social.browser.mjs
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucifer0-browser-checks
          path: test-results/
          retention-days: 7
