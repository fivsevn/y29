name: Test and build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image conversion dependencies
        run: npm ci
      - name: Prepare L0 operation and reading for this run
        run: |
          node lucifer0/tools/update.js prepare --work "$RUNNER_TEMP/l0-work"
          echo '===L0_OPERATION_BEGIN==='
          cat "$RUNNER_TEMP/l0-work/operation.json"
          echo '===L0_OPERATION_END==='
          echo '===L0_READING_BEGIN==='
          cat "$RUNNER_TEMP/l0-work/reading.md"
          echo '===L0_READING_END==='
      - name: Check rules, public content and static build
        run: npm run check
      - name: Keep reviewable static preview
        uses: actions/upload-artifact@v4
        with:
          name: y29-preview
          path: dist/
          retention-days: 7
