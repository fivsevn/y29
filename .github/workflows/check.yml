name: Test and build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image conversion dependencies
        run: npm ci
      - name: Prepare L0 operation and reading for this run
        run: |
          mkdir -p "$RUNNER_TEMP/l0-work"
          cp .l0-work/operation.json "$RUNNER_TEMP/l0-work/operation.json"
          node lucifer0/tools/update.js prepare --work "$RUNNER_TEMP/l0-work"
          echo '===L0_OPERATION_BEGIN==='
          cat "$RUNNER_TEMP/l0-work/operation.json"
          echo '===L0_OPERATION_END==='
          for n in 01 02 03 04 05 06 07 08; do
            echo "===L0_BRIEF_BEGIN_$n==="
            node lucifer0/tools/update.js brief --post "l0-20261110210715-bd3468e0-$n" --work "$RUNNER_TEMP/l0-work"
            echo "===L0_BRIEF_END_$n==="
          done
      - name: Check rules, public content and static build
        run: npm run check
      - name: Keep reviewable static preview
        uses: actions/upload-artifact@v4
        with:
          name: y29-preview
          path: dist/
          retention-days: 7
