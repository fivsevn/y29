name: Test and build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Verify committed feed is current
        run: git diff --exit-code -- social/data/feed.json
      - name: Keep reviewable static preview
        uses: actions/upload-artifact@v4
        with:
          name: y29-preview
          path: dist/
          retention-days: 7
