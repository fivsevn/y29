name: Verify isolated Lucifer Zero publication
on:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed L0 posts using official finish command
        run: |
          mkdir -p "$RUNNER_TEMP/l0-work"
          cp .l0-work/operation.json "$RUNNER_TEMP/l0-work/operation.json"
          echo '===L0_FINISH_BEGIN==='
          node lucifer0/tools/update.js finish --work "$RUNNER_TEMP/l0-work"
          echo '===L0_FINISH_END==='
          test ! -e "$RUNNER_TEMP/l0-work/operation.json"
      - name: Remove temporary verification branch after successful finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/l0-verify-20261111-agentrun
