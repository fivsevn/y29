name: L0 single-run checked publishing
on:
  push:
    branches: [l0-ops-20261108-1304]
    paths: ['.github/workflows/l0-ops-20261108.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the original independently drawn context and ledger
        uses: actions/download-artifact@v4
        with:
          name: l0-20261108-1304-prepared
          run-id: 42449592597
          repository: fivsevn/y29
          github-token: ${{ github.token }}
          path: /tmp/l0-restore
      - name: Refresh, ingest, review and build
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "main has advanced; stop instead of overwriting"; exit 1; }
          mkdir -p /tmp/l0-ops-work /tmp/l0-ops-private/profiles
          research="$(find /tmp/l0-restore -type f -name research.json -print -quit)"
          state="$(find /tmp/l0-restore -type f -name round-state.json -print -quit)"
          test -s "$research" && test -s "$state"
          cp "$research" /tmp/l0-ops-work/research.json
          cp "$state" /tmp/l0-ops-private/round-state.json
          export Y29_SOCIAL_PRIVATE_DIR=/tmp/l0-ops-private/profiles
          npm run social:context -- --seed l0-20261108-1304 --research /tmp/l0-ops-work/research.json --out /tmp/l0-ops-work/context.json
          node --input-type=module <<'L0_CHECK_CONTEXT'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('/tmp/l0-ops-work/context.json','utf8'));
          assert.equal(c.plan.id,'l0-20261108-1304');
          assert.equal(c.plan.randomSeed,'91d75d6336cb81d88cd4e38e6062c7b6');
          assert.equal(c.plan.budget,8);
          assert.deepEqual(c.plan.poolBudgets,{character:2,visitor:6});
          assert.deepEqual(c.plan.selectedIds.visitor,['visitor-psi-upper','visitor-xi-upper','visitor-nu-upper','visitor-phi','visitor-epsilon-upper','visitor-delta']);
          assert.deepEqual(c.plan.selectedIds.character,[]);
          assert.equal(c.review.due,false);
          assert.equal(c.plan.localReview,false);
          console.log('Original draw, account permissions and review state confirmed.');
          L0_CHECK_CONTEXT
          cat > /tmp/l0-ops-work/batch.json <<'L0_BATCH_JSON'
          {
            "version": 1,
            "id": "l0-20261108-1304",
            "mode": "daily",
            "posts": [
              {
                "id": "l0-20261108-1304-01",
                "author": "visitor-delta",
                "createdAt": "2026-11-08T05:48:00+08:00",
                "replyTo": null,
                "text": "昨天记面团手感，只写了“偏凉”，没记室温。早上把温度计放到本子旁边了，省得又忘。",
                "likes": 0,
                "canon": "derivative",
                "media": []
              },
              {
                "id": "l0-20261108-1304-02",
                "author": "visitor-phi",
                "createdAt": "2026-11-08T08:35:00+08:00",
                "replyTo": null,
                "text": "今早楼后那排树里有个叫声，两短一长。没看见鸟，录了十秒。",
                "likes": 0,
                "canon": "derivative",
                "media": []
              },
              {
                "id": "l0-20261108-1304-03",
                "author": "visitor-psi-upper",
                "createdAt": "2026-11-08T09:16:00+08:00",
                "replyTo": null,
                "text": "旧采访笔记有一页只写了“星期三”，月份没记。先夹着，想不起来就不填。",
                "likes": 0,
                "canon": "derivative",
                "media": []
              },
              {
                "id": "l0-20261108-1304-04",
                "author": "visitor-nu-upper",
                "createdAt": "2026-11-08T11:57:00+08:00",
                "replyTo": null,
                "text": "收摊后去看砧板，拿起两块都不顺手。下回再看看。",
                "likes": 0,
                "canon": "derivative",
                "media": []
              },
              {
                "id": "l0-20261108-1304-05",
                "author": "visitor-xi-upper",
                "createdAt": "2026-11-08T12:34:00+08:00",
                "replyTo": null,
                "text": "涂色本那页全是窗户。涂完四个，没换颜色。",
                "likes": 0,
                "canon": "derivative",
                "media": []
              },
              {
                "id": "l0-20261108-1304-06",
                "author": "visitor-epsilon-upper",
                "createdAt": "2026-11-08T13:06:00+08:00",
                "replyTo": null,
                "text": "那张腿松的小凳子还靠墙放着。找东西时又差点坐上去，贴张纸提醒一下。",
                "likes": 0,
                "canon": "derivative",
                "media": []
              }
            ]
          }
          L0_BATCH_JSON
          node lucifer0/tools/publish.js ingest /tmp/l0-ops-work/batch.json --reviewed --ai --context /tmp/l0-ops-work/context.json
          sed -i 's/目前有 23 条主帖、11 条回复。/目前有 29 条主帖、11 条回复。/' lucifer0/docs/community.md
          grep -q '目前有 29 条主帖、11 条回复。' lucifer0/docs/community.md
          npm run social:validate
          npm test
          npm run build
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "main advanced during publication; stop"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lucifer0/posts lucifer0/rounds lucifer0/data/feed.json lucifer0/users/用户总目录.md lucifer0/docs/community.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "路西法零日常运营：六条路人动态（原典缺失保留两份）"
          git push origin HEAD:l0-ops-20261108-1304
          echo "L0_PUBLISHED_SHA=$(git rev-parse HEAD)"
