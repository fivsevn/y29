name: Lucifer0 automated fresh preparation
run-name: Lucifer0 verification round 1 ${{ github.run_id }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucifer0-automation-20261112.yml'
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Collect fresh intake, prepare stable operation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 65); do
            node lucifer0/tools/update.js prepare > /tmp/l0-prepare.json
            status=$(node -e "let d=require('/tmp/l0-prepare.json'); console.log(d.status)")
            echo "Prepare attempt $i: $status"
            if [ "$status" = prepared ] || [ "$status" = resumed ]; then
              ready=1; break
            fi
            if [ "$status" = intake-failed ]; then
              cat /tmp/l0-prepare.json
              exit 1
            fi
            git fetch origin main
            git merge --ff-only FETCH_HEAD
            sleep 12
          done
          test "$ready" = 1 || { echo 'Fresh intake still not ready'; exit 1; }
          cat /tmp/l0-prepare.json
          WORK="$HOME/.local/state/y29/lucifer0/current"
          node --input-type=module - <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          const cs=op.plan.caseAdaptation;
          console.log('===PLAN_START===');
          console.log(JSON.stringify({id:op.id, preparedAt:op.preparedAt, budget:op.plan.budget, totalBudget:op.plan.totalBudget, selectedIds:op.plan.selectedIds, rootOrder:cs?.rootOrder, postIds:cs?.postIds, cases:cs?.items, researchMaintenance:op.plan.researchMaintenance, researchWindows:op.plan.researchWindows},null,2));
          console.log('===PLAN_END===');
          const roots=[...Array.from({length:op.plan.budget},(_,i)=>op.id+'-'+String(i+1).padStart(2,'0')),...(cs?.postIds||[])];
          const briefs=[];
          for(const id of roots) {
            const x=JSON.parse(execFileSync('node',['lucifer0/tools/update.js','brief','--post',id],{encoding:'utf8',maxBuffer:12*1024*1024}));
            briefs.push({id,...x});
            const compact=JSON.stringify(x);
            console.log('===BRIEF_'+id+'_BEGIN===');
            console.log(compact.length>15000?compact.slice(0,15000):compact);
            console.log('===BRIEF_'+id+'_END===');
          }
          await writeFile(w+'briefs.json',JSON.stringify(briefs,null,2)+'\n');
          const exported={};
          for(const name of ['operation.json','reading.md','briefs.json']) {
            const payload=JSON.stringify({content:await readFile(w+name,'utf8'),encoding:'utf-8'});
            const result=JSON.parse(execFileSync('gh',['api','repos/fivsevn/y29/git/blobs','--input','-'],{input:payload,encoding:'utf8',maxBuffer:4*1024*1024}));
            exported[name]=result.sha;
          }
          console.log('L0_EXECUTION_BLOBS='+JSON.stringify(exported));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: l0-fresh-preparation-${{ github.run_id }}
          path: |
            ~/.local/state/y29/lucifer0/current/operation.json
            ~/.local/state/y29/lucifer0/current/reading.md
            ~/.local/state/y29/lucifer0/current/intake-request.json
            ~/.local/state/y29/lucifer0/current/briefs.json
          retention-days: 3
