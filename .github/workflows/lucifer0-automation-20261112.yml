name: Lucifer0 one-time briefing
run-name: Lucifer0 brief ${{ github.run_id }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucifer0-automation-20261112.yml'
permissions:
  contents: read
  actions: read
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Restore preparation and generate briefs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORK="$HOME/.local/state/y29/lucifer0/current"
          mkdir -p "$WORK"
          gh run download 43105855927 -R fivsevn/y29 -n l0-preparation-43105855927 -D "$WORK"
          for ID in \
            l0-20261111214536-e145d75f-f75f6eafc5c3 \
            l0-20261111214536-e145d75f-85c23cd1ff3c \
            l0-20261111214536-e145d75f-5795c2edd2e7 \
            l0-20261111214536-e145d75f-bff2bff8e7a8 \
            l0-20261111214536-e145d75f-cb1dff9b9c4a \
            l0-20261111214536-e145d75f-72922b95dc8d
          do
            echo "===BRIEF-BEGIN:$ID==="
            node lucifer0/tools/update.js brief --post "$ID"
            echo "===BRIEF-END:$ID==="
          done
