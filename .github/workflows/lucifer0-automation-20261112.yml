name: Lucifer0 one-time additional reply briefs
run-name: Lucifer0 additional briefs ${{ github.run_id }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucifer0-automation-20261112.yml'
permissions:
  contents: write
  actions: read
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate reply briefs against fixed roots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORK="$HOME/.local/state/y29/lucifer0/current"
          mkdir -p "$WORK"
          gh run download 43105855927 -R fivsevn/y29 -n l0-preparation-43105855927 -D "$WORK"
          gh api repos/fivsevn/y29/git/blobs/4c6d6e089c8829f85c7c58b6c67e59c715a9a2f5 --jq '.content' | base64 --decode > "$WORK/root-patch.json"
          node --input-type=module - <<'JS'
          import { readFile,writeFile } from 'node:fs/promises';
          const work=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(work+'operation.json','utf8'));
          Object.assign(op,JSON.parse(await readFile(work+'root-patch.json','utf8')));
          await writeFile(work+'operation.json',JSON.stringify(op,null,2)+'\n');
          JS
          echo '===REPLYBRIEF-BEGIN:reply3==='
          node lucifer0/tools/update.js brief --post l0-20261111214536-e145d75f-reply3 --thread l0-20261111214536-e145d75f-72922b95dc8d
          echo '===REPLYBRIEF-END:reply3==='
          echo '===REPLYBRIEF-BEGIN:reply4==='
          node lucifer0/tools/update.js brief --post l0-20261111214536-e145d75f-reply4 --thread l0-20261111214536-e145d75f-cb1dff9b9c4a
          echo '===REPLYBRIEF-END:reply4==='
          echo '===REPLYBRIEF-BEGIN:reply5==='
          node lucifer0/tools/update.js brief --post l0-20261111214536-e145d75f-reply5 --thread l0-20261111214536-e145d75f-85c23cd1ff3c
          echo '===REPLYBRIEF-END:reply5==='
          echo '===REPLYBRIEF-BEGIN:reply6==='
          node lucifer0/tools/update.js brief --post l0-20261111214536-e145d75f-reply6 --thread l0-20261111214536-e145d75f-f75f6eafc5c3
          echo '===REPLYBRIEF-END:reply6==='
      - name: Record briefing pointer
        if: always()
        run: |
          printf '{"runId":"%s"}\n' "$GITHUB_RUN_ID" > .github/state/lucifer0-agent-stage3.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/state/lucifer0-agent-stage3.json
          git commit -m 'Record Lucifer0 additional brief run'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse FETCH_HEAD)"
          git push origin HEAD:main
