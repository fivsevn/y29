name: Inspect new Lucifer0 replies lottery
run-name: Lucifer0 replies audit 2026-11-13
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucifer0-inspect-20261112.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Restore fixed preparation and inspect reply quotas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          mkdir -p "$WORK"
          gh run download 43272001416 -R fivsevn/y29 -n l0-fresh-preparation-43272001416 -D "$WORK"
          gh api repos/fivsevn/y29/git/blobs/d7738cea43f35e876e18d1f6f9060150308df3f3 --jq '.content' | base64 --decode > "$WORK/root-patch.json"
          node --input-type=module - <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          const patch=JSON.parse(await readFile(w+'root-patch.json','utf8'));
          if(op.id!==patch.operationId||op.posts.length||JSON.stringify(op.plan.caseAdaptation.rootOrder)!==JSON.stringify(patch.rootOrder))throw Error('Wrong root order');
          op.posts=patch.posts;op.reviews=patch.reviews;op.research=patch.research;op.mediaReviews=patch.mediaReviews;
          await writeFile(w+'operation.json',JSON.stringify(op,null,2)+'\n');
          const d=JSON.parse(execFileSync('node',['lucifer0/tools/update.js','replies','--work',w],{encoding:'utf8',maxBuffer:1000000}));
          console.log('REPLY_DRAW='+JSON.stringify(d));
          const rows=d.threads||d.roots||d.replies||[];
          let idx=0;
          for(const row of rows){
            if(row.replyCount<1)continue;
            if(idx>=8)break;
            idx++;
            const id=op.id+'-reply'+String(idx).padStart(2,'0');
            const x=JSON.parse(execFileSync('node',['lucifer0/tools/update.js','brief','--post',id,'--thread',row.rootId,'--work',w],{encoding:'utf8',maxBuffer:14000000}));
            const wt=x.writer;const ed=x.editor;
            console.log('REPLY_BRIEF='+JSON.stringify({id,root:row.rootId,drawn:row.replyCount,draft:x.draft,writer:{self:wt.self?.name,author:wt.self?.id,conditions:wt.conditions,discussion:wt.discussion?.requiredTone,stance:wt.discussion?.replyStance,thread:wt.thread,visiblePosts:wt.visiblePosts?.slice?.(0,4),motivation:wt.writing},editor:{replyTarget:ed.replyTarget,replyAuthor:ed.replyAuthor,timing:ed.timing,discussion:ed.discussion}}));
          }
          JS
