name: Inspect fresh Lucifer0 evening publication plan
run-name: Inspect Lucifer0 evening author briefs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucifer0-inspect-20261112.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore prepared operation and inspect all planned roots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          mkdir -p "$WORK"
          gh run download 43220072908 -R fivsevn/y29 -n l0-fresh-preparation-43220072908 -D "$WORK"
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          const clean=o=>JSON.stringify(o);
          console.log('===OPERATION===' +clean({id:op.id,createdAt:op.createdAt,plannedTime:op.plan.timeWindow,budget:op.plan.budget,originalRootIds:op.plan.rootIds,rootOrder:op.plan.caseAdaptation.rootOrder,caseItems:op.plan.caseAdaptation.items.map(q=>({id:q.postId,title:q.sample.title,text:q.sample.text})),selectedIds:op.plan.selectedIds,researchWindows:op.plan.researchWindows,researchMaintenance:op.plan.researchMaintenance}));
          for(const id of op.plan.caseAdaptation.rootOrder) {
            try{
              const d=JSON.parse(execFileSync('node',['lucifer0/tools/update.js','brief','--post',id,'--work',w],{encoding:'utf8',maxBuffer:20000000}));
              const x=d.writer;
              console.log('===BRIEF==='+clean({id,draft:d.draft, self:{id:x.self?.id,name:x.self?.name,documents:x.self?.documents?.map(z=>({sourcePath:z.sourcePath,text:z.text?.slice(0,6000)})),recentPosts:x.self?.recentPosts?.slice(0,5)},conditions:x.conditions,motivation:x.motivation,discussion:x.discussion?.requiredTone,role:x.thread,context:x.caseAdaptation,editor:d.editor && {time:d.editor.timing,discussion:d.editor.discussion,brief:d.editor.brief}}));
            }catch(e){console.log('===BRIEF_ERROR==='+clean({id,message:e.message,stdout:e.stdout?.toString().slice(0,2000)}));}
          }
          JS
