name: Inspect new Lucifer0 root briefs
run-name: Lucifer0 root brief audit 2026-11-13
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucifer0-inspect-20261112.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Restore the fixed preparation and inspect every root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          mkdir -p "$WORK"
          gh run download 43272001416 -R fivsevn/y29 -n l0-fresh-preparation-43272001416 -D "$WORK"
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          if(op.id!=='l0-20261112174153-117eae41'||op.posts.length) throw Error('Wrong preparation');
          console.log('AUDIT_ROOT_ORDER='+JSON.stringify(op.plan.caseAdaptation.rootOrder));
          for(const id of op.plan.caseAdaptation.rootOrder) {
            const d=JSON.parse(execFileSync('node',['lucifer0/tools/update.js','brief','--post',id,'--work',w],{encoding:'utf8',maxBuffer:15*1024*1024}));
            const wri=d.writer,ed=d.editor;
            const docs=(wri.self?.documents||[]).map(q=>{
              const t=q.text||'';
              const p=t.search(/## 网络交往与表达|## 日常表达|## 说话|## 近期/);
              return {path:q.sourcePath||q.path,overview:t.slice(0,620),voice:p<0?'':t.slice(p,p+1700)};
            });
            console.log('AUDIT_ROOT='+JSON.stringify({id,draft:d.draft,writer:{self:wri.self?.name,author:wri.self?.id,documents:docs,conditions:wri.conditions,requiredTone:wri.discussion?.requiredTone,negativeMotivation:wri.discussion?.negativeMotivation,sourceSample:wri.sourceSamples?.selected||null},editor:{timing:ed.timing,replyAuthor:ed.replyAuthor,media:ed.media}}));
          }
          JS
