name: Publish Lucifer0 evening forum update
run-name: Publish Lucifer0 2026-11-12 evening operation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucifer0-publish-20261112.yml'
permissions:
  contents: write
  actions: read
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Restore fresh selected material and reviewed drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          mkdir -p "$WORK"
          gh run download 43220072908 -R fivsevn/y29 -n l0-fresh-preparation-43220072908 -D "$WORK"
          gh api repos/fivsevn/y29/git/blobs/03eed8eb6360155d3d615f8e6b0e64c41e14bb24 --jq '.content' | base64 --decode > "$WORK/root-patch.json"
          gh api repos/fivsevn/y29/git/blobs/bdf7f533337d0d0d0759d3bef3ce650e2543345e --jq '.content' | base64 --decode > "$WORK/reply-patch.json"
          node --input-type=module - <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          const patch=JSON.parse(await readFile(w+'root-patch.json','utf8'));
          if(op.id!=='l0-20261112124122-c232611e'||op.posts.length!==0)throw Error('Unexpected prepared operation');
          if(op.plan.budget!==2||patch.posts.length!==5||patch.research.length<3)throw Error('Invalid root selection or research');
          if(JSON.stringify(op.plan.caseAdaptation.rootOrder)!==JSON.stringify(patch.posts.map(p=>p.id)))throw Error('Root order inconsistent with sealed lottery');
          op.research=patch.research;
          op.researchMaintenance=patch.researchMaintenance;
          op.posts=patch.posts;
          op.reviews=patch.reviews;
          await writeFile(w+'operation.json',JSON.stringify(op,null,2)+'\n');
          JS
          node lucifer0/tools/update.js replies --work "$WORK"
          node --input-type=module - <<'JS'
          import {readFile,writeFile,mkdir} from 'node:fs/promises';
          import {join,dirname} from 'node:path';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          const root=JSON.parse(await readFile(w+'root-patch.json','utf8'));
          const patch=JSON.parse(await readFile(w+'reply-patch.json','utf8'));
          const known=new Set(op.posts.map(p=>p.id));
          if(patch.posts.length!==11||patch.reviews.length!==11)throw Error('Unreviewed or incomplete replies');
          for(const p of patch.posts){if(known.has(p.id))throw Error('Duplicate '+p.id);known.add(p.id);}
          op.posts.push(...patch.posts);op.reviews.push(...patch.reviews);
          for(const asset of [...root.mediaFiles,...patch.mediaFiles]){
            if(!/^posts\/2026\/11\/l0-20261112124122-c232611e-[a-z0-9-]+\/media\/[a-z0-9-]+\.svg$/.test(asset.src))throw Error('Unsafe illustration path '+asset.src);
            const dest=join('lucifer0',asset.src);
            await mkdir(dirname(dest),{recursive:true});
            await writeFile(dest,asset.content,'utf8');
          }
          const roots=op.posts.filter(p=>p.replyTo===null);
          const rootsWithImage=roots.filter(p=>p.media.some(m=>m.kind==='image'));
          const repliesWithImage=op.posts.filter(p=>p.replyTo&&p.media.some(m=>m.kind==='image'));
          if(op.posts.length!==16||op.reviews.length!==16||roots.length!==5||!rootsWithImage.length||!repliesWithImage.length)throw Error('Publication must contain five roots, eleven reviewed replies, and both media pools');
          const orig=new Set(['l0-20261112124122-c232611e-e59538a22e1a','l0-20261112124122-c232611e-24ea9f075cb6']);
          const originalPosts=op.posts.filter(p=>orig.has(p.id)||orig.has(p.replyTo));
          const negative=new Set(op.reviews.filter(x=>x.negative).map(x=>x.postId));
          if(originalPosts.filter(p=>negative.has(p.id)).length<Math.ceil(originalPosts.length*0.5))throw Error('Reviewed negative share below saved requirement');
          await writeFile(w+'operation.json',JSON.stringify(op,null,2)+'\n');
          console.log('Reviewed: '+roots.length+' roots, '+patch.posts.length+' replies, '+(rootsWithImage.length+repliesWithImage.length)+' original illustrations');
          JS
          node lucifer0/tools/update.js suggest --work "$WORK"
      - name: Ingest, validate, build and test
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          node lucifer0/tools/publish.js ingest "$WORK/operation.json" --reviewed --ai
          node lucifer0/tools/publish.js validate
          node build.js
          npm run check
          git status --short
      - name: Publish reviewed content to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || { echo 'Main moved; retain inspected work, do not publish stale source'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lucifer0 .github/state/lucifer0-case-usage.json
          git diff --cached --quiet && { echo 'No publication changes'; exit 1; }
          git commit -m 'Publish Lucifer0 forum update 2026-11-12 evening'
          git push origin HEAD:main
          echo "Published source commit $(git rev-parse HEAD)"
      - name: Trigger GitHub Pages publishing source
        uses: actions/github-script@v7
        with:
          script: await github.rest.repos.requestPagesBuild(context.repo);
      - name: Confirm live feed, verify both images and finish
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          for i in $(seq 1 42); do
            if node lucifer0/tools/update.js finish --work "$WORK" > /tmp/l0-finish.log 2>&1; then
              cat /tmp/l0-finish.log
              break
            fi
            if [ "$i" -eq 42 ]; then
              echo 'Online feed verification did not pass'
              tail -c 4000 /tmp/l0-finish.log
              exit 1
            fi
            sleep 10
          done
          for src in \
            "posts/2026/11/l0-20261112124122-c232611e-24ea9f075cb6/media/paper-trays.webp" \
            "posts/2026/11/l0-20261112124122-c232611e-968c76bfd770/media/ferry-gulls.webp"; do
            url="https://y29.fivsevn.com/lucifer0/$src"
            curl --fail --location --silent --show-error --retry 6 --retry-delay 5 -o "/tmp/$(basename "$src")" "$url"
            test "$(wc -c < "/tmp/$(basename "$src")")" -gt 300 || { echo "Empty image $src"; exit 1; }
            echo "Live image verified: $url"
          done
          echo 'Lucifer0 evening publication completed and verified online'
