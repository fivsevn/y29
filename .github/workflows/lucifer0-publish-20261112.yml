name: Publish Lucifer0 scheduled forum update
run-name: Publish Lucifer0 2026-11-13 researched forum round
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucifer0-publish-20261112.yml']
permissions:
  contents: write
  actions: read
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Restore fixed preparation, reviewed writing and media sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          mkdir -p "$WORK"
          gh run download 43272001416 -R fivsevn/y29 -n l0-fresh-preparation-43272001416 -D "$WORK"
          gh api repos/fivsevn/y29/git/blobs/d7738cea43f35e876e18d1f6f9060150308df3f3 --jq '.content' | base64 --decode > "$WORK/root-patch.json"
          gh api repos/fivsevn/y29/git/blobs/df667b8fefb51680d1f64797bf5f465b78e02cfd --jq '.content' | base64 --decode > "$WORK/reply-patch.json"
          node --input-type=module - <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          const roots=JSON.parse(await readFile(w+'root-patch.json','utf8'));
          if(op.id!==roots.operationId||op.posts.length!==0||roots.posts.length!==10||
             JSON.stringify(op.plan.caseAdaptation.rootOrder)!==JSON.stringify(roots.rootOrder))
            throw Error('Root preparation or sealed case interleaving mismatch');
          op.research=roots.research;
          op.posts=roots.posts;
          op.reviews=roots.reviews;
          op.mediaReviews=roots.mediaReviews;
          await writeFile(w+'operation.json',JSON.stringify(op,null,2)+'\n');
          JS
          node lucifer0/tools/update.js replies --work "$WORK" > /tmp/l0-replies.json
          node --input-type=module - <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          const patch=JSON.parse(await readFile(w+'reply-patch.json','utf8'));
          const drawn=JSON.parse(await readFile('/tmp/l0-replies.json','utf8'));
          if(op.id!==patch.operationId||patch.posts.length!==7||patch.reviews.length!==7||
             patch.photoSources.length!==4)throw Error('Incorrect reviewed replies');
          const allowed=new Map(drawn.threads.map(x=>[x.rootId,x.replyCount]));
          const used=new Map();
          const all=new Set(op.posts.map(p=>p.id));
          for(const p of patch.posts) {
            if(all.has(p.id)||!allowed.has(p.replyTo)||allowed.get(p.replyTo)<1)throw Error('Invalid draw/target for '+p.id);
            used.set(p.replyTo,(used.get(p.replyTo)||0)+1);
            if(used.get(p.replyTo)>allowed.get(p.replyTo))throw Error('Exceeded drawn replies on '+p.replyTo);
            all.add(p.id);
          }
          for(const extra of patch.rootExtensions) {
            const root=op.posts.find(p=>p.id===extra.postId);
            if(!root||root.replyTo!==null||root.media.some(m=>m.kind==='image'))
              throw Error('Unexpected root photo addition');
            root.media.push(...extra.media);
          }
          op.posts.push(...patch.posts);
          op.reviews.push(...patch.reviews);
          op.mediaReviews.push(...patch.mediaReviews);
          if(op.posts.length!==17||op.reviews.length!==17||op.mediaReviews.length!==11||
             op.posts.filter(p=>p.replyTo===null).length!==10)throw Error('Incomplete post, review or photo set');
          await writeFile(w+'operation.json',JSON.stringify(op,null,2)+'\n');
          console.log('Staged '+op.posts.length+' posts, '+op.mediaReviews.length+' distinct CC0 photos; '+used.size+' active reply threads');
          JS
          node --input-type=module - <<'JS'
          import {readFile,mkdir,stat,open} from 'node:fs/promises';
          import {join,dirname} from 'node:path';
          import {execFileSync} from 'node:child_process';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const roots=JSON.parse(await readFile(w+'root-patch.json','utf8'));
          const replies=JSON.parse(await readFile(w+'reply-patch.json','utf8'));
          const sources=[...roots.photoSources,...replies.photoSources];
          if(sources.length!==11||new Set(sources.map(s=>s.src)).size!==11)throw Error('Photo source mismatch');
          for(const source of sources) {
            if(!/^posts\/2026\/11\/l0-20261112174153-117eae41-[a-z0-9-]+\/media\/[a-z0-9-]+\.jpg$/.test(source.src)||
               !source.url.startsWith('https://commons.wikimedia.org/wiki/Special:FilePath/')||source.license!=='CC0 1.0')
              throw Error('Unreviewed photo URL or file');
            const dest=join('lucifer0',source.src);
            await mkdir(dirname(dest),{recursive:true});
            let done=false;
            const urls=[source.url,source.url.replace('Special:FilePath/','Special:Redirect/file/')];
            for(const url of urls){
              try {
                execFileSync('curl',['--fail','--location','--silent','--show-error','--retry','3','--retry-delay','2','--max-time','60','--user-agent','Lucifer0Forum/1.0 (fictional community using CC0 assets)', '--output',dest,url],{stdio:'inherit',timeout:90000});
                const fd=await open(dest,'r');const b=Buffer.alloc(3);await fd.read(b,0,3,0);await fd.close();
                if(b[0]!==0xff||b[1]!==0xd8||b[2]!==0xff)throw Error('Not JPEG');
                if((await stat(dest)).size<4000)throw Error('JPEG too small');
                done=true;break;
              }catch(error){console.log('Photo attempt failed: '+source.commons+' '+String(error.message||error));}
            }
            if(!done)throw Error('Cannot fetch reviewed CC0 asset: '+source.commons);
            console.log('CC0 JPEG ready: '+source.src+' '+(await stat(dest)).size);
          }
          JS
          node lucifer0/tools/update.js suggest --work "$WORK" > /tmp/l0-suggest.json
          node --input-type=module - <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          const suggestion=JSON.parse(await readFile('/tmp/l0-suggest.json','utf8'));
          console.log('PRESENTATION_REVIEW='+JSON.stringify({imagePools:suggestion.imagePools,emotePools:suggestion.emotePools,reviewBasis:suggestion.reviewBasis,diversity:suggestion.diversity}).slice(0,12000));
          if(!suggestion.reviewBasis?.postsDigest||!suggestion.reviewBasis?.historyDigest)
             throw Error('No reliable review basis');
          op.diversityReview={
            postsDigest:suggestion.reviewBasis.postsDigest,
            historyDigest:suggestion.reviewBasis.historyDigest,
            content:'逐条复读上轮内容与本轮抽中人物的过往样本后，新稿采用有挫折的面点出餐、设计本被评价、求职年龄门槛、公交迟到与社区规则争论，回复中也保留唱反调、冷场和小纠正。三项真实案例改编去除平台、账号与可识别人物；AI传闻的先后更正明确保留。未把舆论摘录改写为可靠新闻事实。',
            images:'本轮配图来自11幅可核实 CC0 原始生活照片，并按文具静物、面包、键盘、夜间站台、茶杯、雨天窗景、楼房外观等独立场景匹配具体正文，没有重复旧帖固定插画或把表情包算作普通配图；来源及许可已逐项核对。'
          };
          await writeFile(w+'operation.json',JSON.stringify(op,null,2)+'\n');
          JS
      - name: Archive, validate, build and test
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          node lucifer0/tools/publish.js ingest "$WORK/operation.json" --reviewed --ai
          node lucifer0/tools/publish.js validate
          node build.js
          npm run check
          git status --short
      - name: Commit reviewed forum update on latest main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || { echo 'Main changed during reviewed publication'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lucifer0 .github/state/lucifer0-case-usage.json
          git diff --cached --quiet && { echo 'No publication changes'; exit 1; }
          git commit -m 'Publish reviewed Lucifer0 forum update for November 13'
          git push origin HEAD:main
          echo "L0_PUBLISHED_COMMIT=$(git rev-parse HEAD)"
      - name: Request GitHub Pages refresh
        uses: actions/github-script@v7
        with:
          script: await github.rest.repos.requestPagesBuild(context.repo);
      - name: Verify live feed and all uploaded media
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          for i in $(seq 1 48); do
            if node lucifer0/tools/update.js finish --work "$WORK" > /tmp/l0-finish.log 2>&1; then
              cat /tmp/l0-finish.log
              break
            fi
            if [ "$i" -eq 48 ]; then
              tail -c 6000 /tmp/l0-finish.log
              exit 1
            fi
            sleep 10
          done
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          for(const post of op.posts){
            for(const item of post.media){
              if(item.kind!=='image')continue;
              const url='https://y29.fivsevn.com/lucifer0/'+item.src.replace(/\.(?:jpe?g|png|svg)$/,'.webp');
              execFileSync('curl',['--fail','--location','--silent','--show-error','--retry','5','--retry-delay','3','--max-time','20','-o','/dev/null',url],{stdio:'inherit'});
              console.log('LIVE_IMAGE='+url);
            }
          }
          console.log('L0_FULLY_VERIFIED='+JSON.stringify({id:op.id,posts:op.posts.length,images:op.mediaReviews.length}));
          JS
