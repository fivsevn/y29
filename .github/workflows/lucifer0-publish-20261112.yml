name: Lucifer0 inspect prepared root author briefs
run-name: Lucifer0 roots briefing ${{ github.run_id }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucifer0-publish-20261112.yml'
permissions:
  contents: read
  actions: read
jobs:
  briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Restore fresh operation and brief all mixed roots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          mkdir -p "$WORK"
          gh run download 43142567899 -R fivsevn/y29 -n l0-fresh-preparation-43142567899 -D "$WORK"
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const op=JSON.parse(await readFile(process.env.HOME+'/.local/state/y29/lucifer0/current/operation.json','utf8'));
          for(const id of op.plan.caseAdaptation.rootOrder){
            const r=JSON.parse(execFileSync('node',['lucifer0/tools/update.js','brief','--post',id],{encoding:'utf8',maxBuffer:25*1024*1024}));
            const w=r.writer,e=r.editor;
            const user=w.self||{};
            const result={
              id, draft:r.draft,
              self:{id:user.id,name:user.name,documents:(user.documents||[]).map(d=>({path:d.path,text:d.text?.slice(0,9000)})),recentPosts:(user.recentPosts||[]).slice(0,4)},
              conditions:w.conditions,discussion:w.discussion && {requiredTone:w.discussion.requiredTone,negativeMotivation:w.discussion.negativeMotivation},
              case:w.case || w.caseAdaptation || null,
              editor: e && Object.fromEntries(Object.entries(e).filter(([k])=>!['reading','research','sources','samples'].includes(k)))
            };
            console.log('ROOT_BRIEF_START '+id);
            console.log(JSON.stringify(result));
            console.log('ROOT_BRIEF_END '+id);
          }
          JS
