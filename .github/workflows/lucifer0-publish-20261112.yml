name: Publish Lucifer0 fresh forum update
run-name: Publish Lucifer0 batch 2026-11-12 second pass
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucifer0-publish-20261112.yml'
permissions:
  contents: write
  actions: read
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Restore reviewed roots and new replies with genuine illustrations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          mkdir -p "$WORK"
          gh run download 43143698087 -R fivsevn/y29 -n l0-roots-replies-43143698087 -D "$WORK"
          gh api repos/fivsevn/y29/git/blobs/f8e8f01ffd3d37f1def6a39e8ab15fc667210448 --jq '.content' | base64 --decode > "$WORK/root-patch.json"
          gh api repos/fivsevn/y29/git/blobs/8fd38de75f789ec4252c29a6cdfe0700ceec38a8 --jq '.content' | base64 --decode > "$WORK/reply-patch.json"
          node --input-type=module - <<'JS'
          import {readFile,writeFile,mkdir} from 'node:fs/promises';
          import {join,dirname} from 'node:path';
          const w=process.env.HOME+'/.local/state/y29/lucifer0/current/';
          const op=JSON.parse(await readFile(w+'operation.json','utf8'));
          if(op.id!=='l0-20261112023707-f9dca533')throw Error('Unexpected operation');
          const root=JSON.parse(await readFile(w+'root-patch.json','utf8'));
          const patch=JSON.parse(await readFile(w+'reply-patch.json','utf8'));
          if(JSON.stringify(op.posts)!==JSON.stringify(root.posts)||JSON.stringify(op.reviews)!==JSON.stringify(root.reviews))throw Error('Reviewed roots differ from staged plan');
          const known=new Set(op.posts.map(p=>p.id));
          for(const p of patch.posts){if(known.has(p.id))throw Error('Duplicate '+p.id);known.add(p.id);}
          op.posts.push(...patch.posts);
          op.reviews.push(...patch.reviews);
          for(const asset of [...root.mediaFiles,...patch.mediaFiles]){
            const full=join('lucifer0',asset.src);
            await mkdir(dirname(full),{recursive:true});
            await writeFile(full,asset.content,'utf8');
          }
          if(op.posts.length!==18||op.reviews.length!==18||op.research.length<3)throw Error('Incomplete reviewed batch');
          const actualImages=op.posts.filter(p=>p.media.some(m=>m.kind==='image'));
          console.log('Review: '+op.posts.length+' posts; '+actualImages.length+' illustrated; '+op.research.length+' research pages.');
          await writeFile(w+'operation.json',JSON.stringify(op,null,2)+'\n');
          JS
          node lucifer0/tools/update.js suggest --work "$WORK"
      - name: Ingest, validate, build and check forum
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          node lucifer0/tools/publish.js ingest "$WORK/operation.json" --reviewed --ai
          node lucifer0/tools/publish.js validate
          node build.js
          npm run check
          git status --short
      - name: Commit complete published packages to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || { echo 'Main moved; do not publish stale content'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lucifer0 .github/state/lucifer0-case-usage.json
          git diff --cached --quiet && { echo 'No publication changes'; exit 1; }
          git commit -m 'Publish Lucifer0 forum update 2026-11-12 second batch'
          git push origin HEAD:main
          echo "Published source commit $(git rev-parse HEAD)"
      - name: Trigger GitHub Pages source deployment
        uses: actions/github-script@v7
        with:
          script: await github.rest.repos.requestPagesBuild(context.repo);
      - name: Verify live content and finish batch
        run: |
          set -euo pipefail
          WORK="$HOME/.local/state/y29/lucifer0/current"
          for i in $(seq 1 32); do
            if node lucifer0/tools/update.js finish --work "$WORK" > /tmp/l0-finish.log 2>&1; then
              cat /tmp/l0-finish.log
              echo 'Lucifer0 fresh publication completed, online feed verified'
              exit 0
            fi
            echo "Online verification attempt $i:"
            tail -c 1000 /tmp/l0-finish.log
            sleep 10
          done
          echo 'Source was committed but online verification has not passed'
          exit 1
