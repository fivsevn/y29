name: Publish reviewed Lucifer0 forum update
run-name: Publish Lucifer0 ${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Reviewed operation ID from its replay manifest
        type: string
        required: true
      archive_repository:
        description: Private owner/repo; defaults to LUCIFER0_ARCHIVE_REPOSITORY
        type: string
        required: false
      archive_ref:
        description: Archive branch or immutable commit
        type: string
        default: main
        required: true
      bundle_id:
        description: Optional immutable reviewed bundle SHA256; otherwise use the latest reviewed snapshot
        type: string
        required: false
permissions:
  contents: write
  actions: read
  pages: write
concurrency:
  group: lucifer0-publication
  cancel-in-progress: false
env:
  ARCHIVE_REPOSITORY: ${{ inputs.archive_repository || vars.LUCIFER0_ARCHIVE_REPOSITORY }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select external working directory
        run: echo "Y29_SOCIAL_WORK_DIR=$RUNNER_TEMP/lucifer0-current" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check replay source configuration
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_REPOSITORY" || { echo 'Set LUCIFER0_ARCHIVE_REPOSITORY or supply archive_repository'; exit 1; }
          test -n "$GH_TOKEN" || { echo 'Configure ARCHIVE_TOKEN for the private archive repository'; exit 1; }
          test "$(gh api "repos/$ARCHIVE_REPOSITORY" --jq '.private')" = true || { echo 'Replay inputs require a private archive repository'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ARCHIVE_REPOSITORY }}
          ref: ${{ inputs.archive_ref }}
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: _operation_archive
      - name: Verify and restore the reviewed replay bundle
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import { restoreArchive } from './.github/scripts/lucifer0-operation-archive.mjs';
          import { execFileSync } from 'node:child_process';
          const result = await restoreArchive({ archive: '_operation_archive', operationId: process.env.OPERATION_ID, stage: 'reviewed', bundleId: process.env.BUNDLE_ID || undefined, root: 'lucifer0', work: process.env.Y29_SOCIAL_WORK_DIR });
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (result.sourceRevision !== head) throw Error('The reviewed source revision differs from main. Restore that revision for inspection, or refresh and review the operation against current main before publishing.');
          console.log(JSON.stringify(result));
          JS
      - run: npm ci
      - name: Archive posts, validate and test
        run: |
          set -euo pipefail
          node lucifer0/tools/publish.js ingest "$Y29_SOCIAL_WORK_DIR/operation.json" --reviewed --ai
          npm run check
      - name: Commit the reviewed update on unchanged main
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || { echo 'Main changed during reviewed publication'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lucifer0 .github/state/lucifer0-case-usage.json
          git diff --cached --quiet && { echo 'The operation has no new publication changes'; exit 1; }
          git commit -m "Publish reviewed Lucifer0 operation $OPERATION_ID"
          git push origin HEAD:main
      - name: Request GitHub Pages refresh
        uses: actions/github-script@v7
        with:
          script: await github.rest.repos.requestPagesBuild(context.repo);
      - name: Verify the published operation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            if node lucifer0/tools/update.js finish > "$RUNNER_TEMP/l0-finish.log" 2>&1; then cat "$RUNNER_TEMP/l0-finish.log"; exit 0; fi
            if [ "$attempt" -eq 48 ]; then cat "$RUNNER_TEMP/l0-finish.log"; exit 1; fi
            sleep 10
          done
