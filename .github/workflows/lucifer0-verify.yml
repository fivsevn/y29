name: Verify published Lucifer0 forum files
on:
  push:
    branches: [main]
    paths:
      - 'lucifer0/**'
      - '.github/workflows/lucifer0-verify.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare deployed source, full feed and every referenced image
        env:
          PUBLISHED_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const base='https://y29.fivsevn.com/lucifer0/';
          const revision=process.env.PUBLISHED_REVISION;
          const expected=JSON.parse(await readFile('lucifer0/data/feed.json','utf8'));
          const media=[...new Set(expected.posts.flatMap(post=>post.media.map(item=>item.src)))];
          const files=['index.html','app.js','core.js','style.css','data/feed.json',...media];
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          async function verify(path){
            const wanted=hash(await readFile('lucifer0/'+path));
            let last;
            for(let attempt=0;attempt<12;attempt++){
              try{
                const response=await fetch(base+path+'?revision='+revision,{cache:'no-store',signal:AbortSignal.timeout(20000)});
                if(!response.ok)throw Error('HTTP '+response.status);
                if(hash(Buffer.from(await response.arrayBuffer()))!==wanted)throw Error('Deployed bytes do not match '+revision);
                return;
              }catch(error){last=error;await new Promise(done=>setTimeout(done,5000));}
            }
            throw Error(path+': '+last);
          }
          for(let offset=0;offset<files.length;offset+=6)await Promise.all(files.slice(offset,offset+6).map(verify));
          const isEmote=item=>item.src.startsWith('assets/emotes/');
          console.log('LUCIFER0_LIVE_VERIFIED '+JSON.stringify({commit:revision,files:files.length,posts:expected.posts.length,roots:expected.posts.filter(post=>!post.replyTo).length,replies:expected.posts.filter(post=>post.replyTo).length,emotes:expected.posts.flatMap(post=>post.media).filter(isEmote).length}));
          JS
