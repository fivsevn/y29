name: Refresh daily opinion intake
run-name: ${{ github.event_name == 'push' && github.event.head_commit.message || format('Opinion intake {0}', inputs.request_id || 'daily') }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request ID supplied by forum prepare; leave empty for an ordinary refresh
        required: false
        type: string
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai; GitHub may start scheduled runs later.
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/opinion-intake.yml'
      - '.github/scripts/opinion-intake-request.mjs'
      - '.github/state/lucifer0-intake-request.json'
      - 'lucifer0/tools/collect-opinions.js'
      - 'lucifer0/tools/samples.js'
      - 'lucifer0/tools/case-usage.js'

permissions:
  contents: read

concurrency:
  group: lucifer0-opinion-intake
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the generated commit attributable to this run's exact head SHA.
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the refresh request
        id: request
        env:
          INTAKE_REQUEST_ID: ${{ inputs.request_id }}
        run: node .github/scripts/opinion-intake-request.mjs
      - run: npm ci
      - name: Check collection and forum reading
        run: node --test tests/opinion-intake-request.test.js tests/opinion-collection.test.js tests/samples.test.js tests/intake-refresh.test.js tests/case-adaptation.test.js tests/social-operations.test.js tests/population.test.js
      - name: Collect the current batch
        id: collect
        continue-on-error: true
        run: node lucifer0/tools/collect-opinions.js
      - name: Attach the request receipt marker
        env:
          INTAKE_REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          node --input-type=module - <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'lucifer0/environment/source-sampling.md';
          const id = process.env.INTAKE_REQUEST_ID || '';
          if (id && !/^[A-Za-z0-9_-]{1,100}$/.test(id)) throw new Error('Invalid intake request ID');
          let text = await readFile(path, 'utf8');
          text = text.replace(/^<!-- intake-request:[A-Za-z0-9_-]{1,100} -->\r?\n?/gm, '');
          const marker = '<!-- samples:start -->';
          if (text.split(marker).length !== 2) throw new Error('Invalid material boundary');
          if (id) text = text.replace(marker, `<!-- intake-request:${id} -->\n${marker}`);
          await writeFile(path, text);
          JS
      - name: Validate the refreshed material
        run: node lucifer0/tools/samples.js validate
      - name: Publish only the current material document
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::Main changed during collection; rerun from the latest version."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lucifer0/environment/source-sampling.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh current opinion material'
            git push origin HEAD:main
          fi
      - name: Refresh the existing Pages source
        uses: actions/github-script@v7
        with:
          script: await github.rest.repos.requestPagesBuild(context.repo);
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection did not finish successfully. Check its summary and the material document timestamp."
          exit 1
