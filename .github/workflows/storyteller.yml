name: STORYTELLER Discussion sync
on:
  discussion_comment:
    types: [created]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storyteller.yml'
      - '.github/scripts/storyteller-sync.mjs'
      - 'storyteller/**'
permissions:
  contents: write
  discussions: read
  pages: write
jobs:
  sync:
    if: github.event_name != 'discussion_comment' || github.event.discussion.number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/storyteller*.test.js
      - name: Synchronize current state with optimistic conflict retries
        uses: actions/github-script@v7
        with:
          script: |
            const {default: sync} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/storyteller-sync.mjs`);
            await sync({github,context});
      # GITHUB_TOKEN commits do not automatically trigger Pages branch builds.
      # Explicitly build the existing publishing source; preserve all other pages.
      - name: Publish current state through existing Pages build
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.requestPagesBuild(context.repo);
